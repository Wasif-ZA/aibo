[project]
name = "aibo"
version = "0.1.0"
description = "An assistant that knows who you are, so your tools stop asking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml>=6"]

[project.scripts]
aibo = "aibo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aibo"]
